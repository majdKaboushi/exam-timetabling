<!-- ACO Section -->
<section id="acoCard" class="mb-4" style="display: none">
  <div class="card algo-card aco">
    <div class="card-header">
      <h5 class="mb-0">
        <i class="bi bi-bug me-2"></i>
        6) Ant Colony Optimization (ACO)
      </h5>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Number of Ants:</label>
          <input
            type="number"
            id="acoAnts"
            class="form-control"
            value="30"
            min="10"
            max="200"
          />
        </div>
        <div class="col-md-3">
          <label class="form-label">Iterations:</label>
          <input
            type="number"
            id="acoIter"
            class="form-control"
            value="100"
            min="10"
            max="1000"
          />
        </div>
        <div class="col-md-2">
          <label class="form-label">Pheromone (alpha):</label>
          <input
            type="number"
            id="acoAlpha"
            class="form-control"
            value="1.0"
            step="0.1"
            min="0.1"
            max="5"
          />
        </div>
        <div class="col-md-2">
          <label class="form-label">Heuristic (beta):</label>
          <input
            type="number"
            id="acoBeta"
            class="form-control"
            value="2.0"
            step="0.1"
            min="0.1"
            max="5"
          />
        </div>
        <div class="col-md-2">
          <label class="form-label">Evaporation Rate:</label>
          <input
            type="number"
            id="acoEvap"
            class="form-control"
            value="0.1"
            step="0.05"
            min="0.01"
            max="0.9"
          />
        </div>
      </div>
      <div class="mt-3">
        <button id="runACOBtn" class="btn btn-primary">
          <i class="bi bi-play-fill me-2"></i>
          Run ACO
        </button>
      </div>
      <div id="acoResultBox" class="mt-4"></div>
      <div class="mt-3">
        <button id="acoExportCSV" class="btn btn-success">
          <i class="bi bi-file-earmark-csv me-2"></i>
          Export ACO Schedule (CSV)
        </button>
      </div>
      <h6 class="mt-4 mb-3">Best ACO Schedule:</h6>
      <div class="table-responsive">
        <table id="acoScheduleTable" class="table table-hover"></table>
      </div>
    </div>
  </div>
</section>
