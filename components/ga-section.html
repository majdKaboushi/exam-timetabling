<!-- GA Section -->
<section id="gaCard" class="mb-4" style="display: none">
  <div class="card algo-card ga">
    <div class="card-header">
      <h5 class="mb-0">
        <i class="bi bi-dna me-2"></i>
        4) Genetic Algorithm (GA)
      </h5>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Population Size:</label>
          <input
            type="number"
            id="gaPop"
            class="form-control"
            value="30"
            min="10"
            max="200"
          />
        </div>
        <div class="col-md-3">
          <label class="form-label">Generations:</label>
          <input
            type="number"
            id="gaGen"
            class="form-control"
            value="100"
            min="10"
            max="1000"
          />
        </div>
        <div class="col-md-3">
          <label class="form-label">Mutation Rate:</label>
          <input
            type="number"
            id="gaMut"
            class="form-control"
            value="0.1"
            min="0"
            max="1"
            step="0.05"
          />
        </div>
        <div class="col-md-3">
          <label class="form-label">Elitism:</label>
          <input
            type="number"
            id="gaEli"
            class="form-control"
            value="2"
            min="0"
            max="10"
          />
        </div>
      </div>
      <div class="mt-3">
        <button id="runGABtn" class="btn btn-primary">
          <i class="bi bi-play-fill me-2"></i>
          Run GA
        </button>
      </div>
      <div id="gaResultBox" class="mt-4"></div>
      <div class="mt-3">
        <button id="gaExportCSV" class="btn btn-success">
          <i class="bi bi-file-earmark-csv me-2"></i>
          Export GA Schedule (CSV)
        </button>
      </div>
      <h6 class="mt-4 mb-3">Best GA Schedule:</h6>
      <div class="table-responsive">
        <table id="gaScheduleTable" class="table table-hover"></table>
      </div>
    </div>
  </div>
</section>
