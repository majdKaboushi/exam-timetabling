<!-- Experiments Section -->
<section id="expCard" class="mb-4" style="display: none">
  <div class="card" style="border: 3px solid #2563eb">
    <div class="card-header">
      <h5 class="mb-0">
        <i class="bi bi-graph-up me-2"></i>
        7) Comprehensive Experiments (Statistical Comparison)
      </h5>
    </div>
    <div class="card-body">
      <p class="text-muted">
        Run all three algorithms 10 times to calculate average, best,
        worst, and standard deviation.
      </p>
      <div class="row g-3 align-items-end">
        <div class="col-md-4">
          <label class="form-label">Number of Runs:</label>
          <input
            type="number"
            id="expRuns"
            class="form-control"
            value="10"
            min="1"
            max="50"
          />
        </div>
        <div class="col-md-8">
          <button id="runExpBtn" class="btn btn-success">
            <i class="bi bi-play-circle me-2"></i>
            Start Comprehensive Experiment
          </button>
        </div>
      </div>
      <div id="expProgress" class="mt-3 fw-bold text-primary"></div>
      <div id="expLoadingIndicator" class="mt-3" style="display: none;">
        <div class="d-flex align-items-center">
          <div class="spinner-border text-primary me-3" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <span class="text-primary">Running comprehensive experiment... This may take a while for large datasets.</span>
        </div>
      </div>

      <div id="expResultsDiv" class="mt-4" style="display: none">
        <h6 class="mb-3">Statistical Comparison Table:</h6>
        <div class="table-responsive">
          <table id="expResultsTable" class="table table-hover"></table>
        </div>
        <div class="mt-3">
          <button id="expExportCSV" class="btn btn-danger">
            <i class="bi bi-file-earmark-spreadsheet me-2"></i>
            Export Comparison Results (CSV)
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
