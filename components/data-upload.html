<!-- Data Upload Section -->
<section id="data-section" class="mb-4">
  <div class="card">
    <div class="card-header">
      <h5 class="mb-0">
        <i class="bi bi-cloud-upload me-2"></i>
        1) Upload Data
      </h5>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <label class="form-label"
            >Bulk Upload (All CSV files together):</label
          >
          <input
            type="file"
            id="bulkInput"
            class="form-control"
            multiple
            accept=".csv"
          />
        </div>
        <div class="col-md-6">
          <div id="individualInputs"></div>
        </div>
      </div>
      <div class="mt-3">
        <button id="loadBtn" class="btn btn-primary">
          <i class="bi bi-upload me-2"></i>
          Load Data
        </button>
      </div>
    </div>
  </div>
</section>
